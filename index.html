<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122c39"><title>世界日報｜每日重點新聞</title><style>:root{font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#172235;background:#fff;--ink:#172235;--muted:#596575;--line:#dce1e6;--accent:#a72932;--nav:#15243b;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bc7380;outline-offset:3px}a{color:inherit}header{background:#fff}.topbar{background:var(--nav);color:#fff}.top-inner,.masthead,.nav-inner,.wrap{max-width:1320px;margin:auto;padding-left:32px;padding-right:32px}.top-inner{display:flex;justify-content:space-between;align-items:center;min-height:39px;gap:12px;font-size:14px}.edition{font-weight:700;letter-spacing:.04em}.topbar span:last-child{color:#dae0ea}.masthead{display:flex;align-items:center;justify-content:space-between;padding-top:23px;padding-bottom:25px;gap:24px}.brand{font-family:Georgia,"Noto Serif TC","PMingLiU",serif;font-size:clamp(30px,4vw,51px);font-weight:900;letter-spacing:-.08em;line-height:1.05}.brand-wrap{display:flex;align-items:center;gap:13px}.brand-mark{width:43px;height:43px;display:grid;place-items:center;color:#fff;background:var(--accent);font:900 25px Georgia,serif;border-radius:3px}.brand-sub{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--muted);margin-top:8px}.masthead-note{font-size:14px;color:var(--muted);text-align:right;line-height:1.6}.nav-bar{border-top:1px solid var(--line);border-bottom:2px solid var(--ink);position:sticky;top:0;background:#fff;z-index:10}.nav-inner{display:flex;align-items:center;gap:8px}.filters{display:flex;gap:3px;align-items:stretch;overflow:auto;scrollbar-width:none;flex:1;white-space:nowrap}.filters::-webkit-scrollbar{display:none}.filters button{border:0;background:transparent;padding:14px 16px;border-bottom:3px solid transparent;border-radius:0;color:#344054;font-weight:700;font-size:15px}.filters button.active{color:var(--accent);border-bottom-color:var(--accent);background:transparent}.filters button:hover{background:#f5f5f5}.wrap{padding-top:24px;padding-bottom:46px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}.toolbar label{font-size:14px;color:var(--muted);font-weight:700;display:flex;gap:10px;align-items:center}.toolbar input,.toolbar select,.toolbar button{font:inherit;color:var(--ink);border:1px solid #cbd1d9;border-radius:5px;padding:10px 12px;background:#fff;font-size:14px}.toolbar input{flex:1;min-width:150px}.toolbar button{font-weight:700}.section{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:23px 0 18px}.section h2{font:900 clamp(25px,3vw,34px)/1.2 Georgia,"Noto Serif TC",serif;margin:3px 0 0}.kicker{color:var(--accent);font-size:13px;letter-spacing:.13em;font-weight:800}.section small{color:var(--muted);font-size:14px;font-weight:600}.news-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:30px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;align-content:start}.card{min-width:0;border-bottom:1px solid var(--line);padding:0 0 22px;margin-bottom:24px;display:flex;flex-direction:column;gap:10px}.card.lead{grid-column:1/-1;display:grid;grid-template-columns:1.18fr 1fr;align-items:center;gap:24px;border-bottom:2px solid var(--ink);padding-bottom:26px}.thumb{position:relative;display:block;width:100%;overflow:hidden;aspect-ratio:16/10;background:#e9edf2;border:0;padding:0;border-radius:0}.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}.thumb:hover img{transform:scale(1.025)}.thumb .photo-label{position:absolute;bottom:0;left:0;max-width:100%;font-size:11px;font-weight:700;padding:5px 7px;color:white;background:#172235d9}.card-content{display:flex;flex-direction:column;gap:9px;min-width:0}.card h3{font-family:Georgia,"Noto Serif TC","PMingLiU",serif;font-weight:900;font-size:23px;line-height:1.35;letter-spacing:-.02em;margin:0;cursor:pointer}.card.lead h3{font-size:clamp(27px,3.2vw,40px)}.card.lead:not(:has(.thumb)){display:flex;align-items:stretch}.thumb img[src$='.svg']{object-fit:contain;padding:25px}.card h3:hover{color:var(--accent)}.card p{font-size:16px;line-height:1.75;margin:0;color:#414e60}.tag{display:inline-block;font-size:13px;color:var(--accent);font-weight:850;background:#f7ebec;padding:4px 8px;border-radius:3px}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:13px}.original{font-size:14px;color:var(--muted);line-height:1.5}.card .original{display:none}.card-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:4px}.card .read-btn{border:none;background:var(--ink);color:#fff;font-weight:700;padding:9px 13px;font-size:14px;border-radius:4px}.card-links a{color:#53606f;font-weight:600;font-size:13px;text-decoration:none}.card-links a:hover{text-decoration:underline}.sidebar{border-left:1px solid var(--line);padding-left:24px}.sidebar h2{font:900 23px/1.3 Georgia,"Noto Serif TC",serif;border-top:4px solid var(--accent);margin:0 0 14px;padding-top:12px}.sidebar p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 13px}.digest-item{display:grid;grid-template-columns:28px 1fr;gap:8px;background:white;border:0;border-top:1px solid var(--line);text-align:left;width:100%;padding:14px 0;color:var(--ink)}.digest-item:hover{color:var(--accent)}.digest-number{font:800 22px Georgia,serif;color:#a72932}.digest-item strong{font-size:15px;line-height:1.5}.digest-item small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.foot{color:var(--muted);font-size:14px;line-height:1.75}.footer{border-top:2px solid var(--nav);padding-top:20px;margin-top:10px;display:flex;gap:18px;justify-content:space-between;align-items:start}.empty{padding:30px 14px;color:var(--muted);grid-column:1/-1}.reader button.close{font:inherit;padding:10px 15px;border:1px solid var(--line);border-radius:4px}.reader a{color:var(--accent)}@media(max-width:1000px){.news-layout{grid-template-columns:minmax(0,1fr)}.sidebar{border-left:0;border-top:1px solid var(--line);padding:20px 0 0}.digest-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.masthead-note{display:none}}@media(max-width:650px){.top-inner,.masthead,.nav-inner,.wrap{padding-left:16px;padding-right:16px}.topbar span:last-child{display:none}.masthead{padding-top:19px;padding-bottom:19px}.brand-mark{width:34px;height:34px;font-size:21px}.brand-sub{font-size:11px}.filters button{padding:12px 13px}.wrap{padding-top:15px}.toolbar{gap:8px}.toolbar label{width:100%;display:flex}.toolbar label select{flex:1}.search {flex:1}.section{margin:20px 0 16px}.cards{grid-template-columns:1fr}.card.lead{display:flex;grid-column:auto;align-items:stretch;gap:12px}.card.lead h3{font-size:29px}.card h3{font-size:24px}.digest-list{grid-template-columns:1fr}.footer{display:block}.news-layout{gap:16px}}</style><style>.read-btn{align-self:flex-start;background:#122c39;color:white;font-weight:700;border:0;padding:12px 16px}.read-btn:hover{background:#24556a}.card h3{cursor:pointer}.reader{border:none;border-radius:14px;width:min(760px,calc(100% - 24px));max-height:90vh;padding:0;color:#152e3c;background:white;box-shadow:0 12px 60px #0004}.reader::backdrop{background:#122c39b8}.reader-inner{padding:clamp(22px,5vw,46px)}.reader-top{display:flex;justify-content:space-between;align-items:center;gap:18px}.reader h2{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(27px,4vw,40px);line-height:1.45;margin:22px 0 10px}.reader h3{border-top:1px solid #dbe2df;margin-top:28px;padding-top:20px}.reader p{line-height:1.95;margin:12px 0}.reader a{color:#1d6955;font-weight:700}.reader .notice{font-size:14px;color:#526873;background:#f2f5f2;padding:12px;border-radius:6px}.reader .close{position:sticky;top:8px;background:white;flex-shrink:0}</style><style>.article-image{margin:24px 0 30px;background:#f3f5f4;border:1px solid #dbe2df;border-radius:10px;overflow:hidden}.article-image img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#eef2ef}.article-image figcaption{padding:12px 16px;display:flex;gap:6px 14px;flex-wrap:wrap;line-height:1.5;color:#526873;font-size:13px}.article-image figcaption span:first-child{width:100%;font-size:14px;color:#152e3c}.article-section{margin:20px 0}.article-section h3{font-size:22px;border-top:2px solid #b8c9c6;padding-top:20px}.article-section .section-hint{font-size:14px;color:#526873}.brief-section{background:#f0f5f2;padding:20px 24px;border-radius:8px}.brief-section h3{border:0;padding-top:0;margin:0 0 15px}.brief-section ul{padding-left:22px;line-height:1.9;margin:12px 0}.brief-section li{margin:6px 0}.brief-section h4{font-size:16px;margin-bottom:0;color:#285247}@media(max-width:650px){.article-image img{max-height:280px}.brief-section{padding:16px}.article-section h3{font-size:20px}}</style></head><body><header><div class="topbar"><div class="top-inner"><span class="edition">世界日報 · 繁體中文</span><span id="todayLabel">台北時間</span></div></div><div class="masthead"><div class="brand-wrap"><div class="brand-mark">W</div><div><div class="brand">世界日報</div><div class="brand-sub">WORLD BRIEF</div></div></div><div class="masthead-note">每小時掌握世界脈動<br>中英文來源 · 繁體中文編譯</div></div></header><div class="nav-bar"><div class="nav-inner"><nav class="filters" id="filters" aria-label="新聞分類"></nav></div></div><main class="wrap"><div class="toolbar"><label>新聞日期 <select id="day" aria-label="新聞日期"></select></label><input id="search" class="search" type="search" placeholder="搜尋標題、關鍵字或來源" aria-label="搜尋新聞"><button id="refresh">重新整理</button></div><div class="section"><div><div class="kicker">TOP STORIES</div><h2 id="heading">今日焦點</h2></div><small id="count"></small></div><div class="news-layout"><section id="cards" class="cards" aria-live="polite"></section><aside class="sidebar"><h2>本日新聞索引</h2><p>快速掌握本期報導，點擊任何標題閱讀。</p><div id="digest" class="digest-list"></div></aside></div><p id="status" class="foot"></p><footer class="footer"><div><strong>世界日報</strong><p class="foot">以可信中英文媒體與官方消息為基礎，涵蓋所有重大新聞。英文來源以繁體中文編譯，圖片標示來源與授權。</p></div><div class="foot">WORLD BRIEF · 每小時更新</div></footer></main><script>let data,cat='全部';const $=id=>document.getElementById(id);const preferred=['全部','國際','台灣','政治','財經','科技','軍事','社會','環境','自然災害','科學','健康','文化','體育','其他'];
function el(tag,txt,cls){const n=document.createElement(tag);if(txt)n.textContent=txt;if(cls)n.className=cls;return n}
$('todayLabel').textContent=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date())+' · 台北';
function render(){if(!data)return;const q=$('search').value.trim().toLowerCase();const list=data.stories.filter(s=>(cat==='全部'||s.category===cat)&&JSON.stringify(s).toLowerCase().includes(q));$('heading').textContent=(cat==='全部'?'今日焦點':cat+'新聞')+'｜'+data.date;$('count').textContent=list.length+' 則報導';$('cards').replaceChildren();$('digest').replaceChildren();
if(!list.length)$('cards').append(el('div','目前沒有符合的新聞。','empty'));
for(const [i,s] of list.entries()){const x=el('article','','card'+(i===0&&cat==='全部'&&!q?' lead':''));if(s.image?.url){try{const u=new URL(s.image.url);if(u.protocol==='https:'){const thumb=el('button','','thumb');thumb.setAttribute('aria-label','閱讀：'+s.title);const img=el('img');img.src=u.href;img.alt=s.image.caption||s.title;img.loading=i<2?'eager':'lazy';img.referrerPolicy='no-referrer';img.onerror=()=>thumb.remove();thumb.append(img,el('span',s.image.kind==='original'?'授權原圖':'相關資料圖片','photo-label'));thumb.onclick=()=>showArticle(s);x.append(thumb)}}catch{}}
const content=el('div','','card-content');const meta=el('div','','meta');meta.append(el('span',s.category,'tag'),el('span',s.source),el('span',s.lang==='EN'?'英文來源・繁中編譯':'中文來源'));const title=el('h3',s.title);title.onclick=()=>showArticle(s);content.append(meta,title,el('p',s.summary));const links=el('div','','card-links');const read=el('button','閱讀報導','read-btn');read.onclick=()=>showArticle(s);links.append(read);const original=safeLink(s.url,'原始來源');if(original)links.append(original);content.append(links);x.append(content);$('cards').append(x);
const item=el('button','','digest-item');item.append(el('span',String(i+1).padStart(2,'0'),'digest-number'));const right=el('div');right.append(el('strong',s.title),el('small',s.category+' · '+s.source));item.append(right);item.onclick=()=>showArticle(s);$('digest').append(item)}
$('status').textContent='本期更新：'+data.updated+'（台灣時間）'+(data.archiveNote?' · '+data.archiveNote:'')}
function tabs(){const categories=[...new Set([...preferred,...(data?.stories||[]).map(s=>s.category).filter(Boolean)])];$('filters').replaceChildren();for(const c of categories){const b=el('button',c,c===cat?'active':'');b.setAttribute('aria-pressed',String(c===cat));b.onclick=()=>{cat=c;for(const n of $('filters').children){n.classList.toggle('active',n===b);n.setAttribute('aria-pressed',String(n===b))}render()};$('filters').append(b)}}
async function load(date){$('status').textContent='正在載入新聞…';try{const r=await fetch('./news.json',{cache:'no-store'});if(!r.ok)throw Error();const archive=await r.json();const dates=Object.keys(archive.editions).sort().reverse();const selected=date&&archive.editions[date]?date:dates[0];data={...archive.editions[selected],dates};$('day').replaceChildren(...dates.map(d=>{const n=el('option',d);n.value=d;n.selected=d===data.date;return n}));tabs();render()}catch{$('status').textContent='暫時無法讀取新聞，請稍後重新整理。'}}$('search').oninput=render;$('day').onchange=()=>load($('day').value);$('refresh').onclick=()=>load($('day').value);tabs();load();</script><dialog id="reader" class="reader"><div class="reader-inner"><div class="reader-top"><span class="tag">站內閱讀</span><button class="close" id="readerClose">關閉 ×</button></div><div id="readerBody"></div></div></dialog><script>
function safeLink(url,label){try{const u=new URL(url);if(u.protocol!=='https:')return null;const a=el('a',label);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a}catch{return null}}
function showArticle(s){
const body=$('readerBody');body.replaceChildren();
body.append(el('h2',s.title),el('div',s.source+' · '+(s.published||data.date)+' · '+(s.lang==='EN'?'英文來源・繁中編譯':'中文來源'),'meta'));
if(s.original)body.append(el('p',s.original,'original'));
const originalLink=safeLink(s.url,'閱讀原文及原始照片');
if(originalLink)body.append(originalLink);
if(s.image&&s.image.url){try{const url=new URL(s.image.url);if(url.protocol==='https:'){const figure=el('figure','','article-image');const image=el('img');image.src=url.href;image.alt=s.image.caption||s.title;image.loading='lazy';image.referrerPolicy='no-referrer';image.onerror=()=>{image.remove()};const caption=el('figcaption');caption.append(el('span',(s.image.kind==='original'?'原文授權圖片｜':'相關資料圖片｜')+(s.image.caption||'新聞相關圖片')),el('span','圖源：'+(s.image.credit||'來源網站')+' · '+(s.image.license||'授權資訊見來源')));const src=safeLink(s.image.source,'圖片來源');const license=safeLink(s.image.licenseUrl,'授權資訊');if(src)caption.append(src);if(license)caption.append(license);figure.append(image,caption);body.append(figure)}}catch{}}
else if(originalLink){const note=el('p','原始報導圖片可透過上方連結瀏覽。','notice');body.append(note)}
const article=el('section','','article-section');article.append(el('h3','第一部分｜'+(s.translationType==='authorized-full'?'授權全文翻譯':'繁體中文報導正文')),el('p',s.translationType==='authorized-full'?'已取得全文翻譯使用授權。':'依來源報導，以繁體中文編譯呈現；非逐字或完整原文翻譯。','section-hint'));
const paragraphs=Array.isArray(s.article)&&s.article.length?s.article:[s.summary,...(s.detail||[]),s.background].filter(Boolean);
for(const p of paragraphs)article.append(el('p',p));body.append(article);
const brief=el('section','','article-section brief-section');brief.append(el('h3','第二部分｜重點整理'));const points=Array.isArray(s.keyPoints)&&s.keyPoints.length?s.keyPoints:[s.summary];const list=el('ul');for(const p of points)if(p)list.append(el('li',p));brief.append(list);if(s.impact)brief.append(el('h4','為什麼重要'),el('p',s.impact));if(s.watch)brief.append(el('h4','後續觀察'),el('p',s.watch));body.append(brief);
body.append(el('p','圖片均標示來源與授權；原文內容及未獲授權的原始圖片請至原報導閱讀。','notice'));const endLink=safeLink(s.url,'前往原始報導');if(endLink)body.append(endLink);
$('reader').showModal();$('reader').scrollTop=0;$('readerClose').focus()}
$('readerClose').onclick=()=>$('reader').close();$('reader').addEventListener('click',e=>{if(e.target===$('reader'))$('reader').close()});</script></body></html>
