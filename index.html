<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122c39"><title>世界日報｜每日重點新聞</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#152e3c;background:#f4f5f2;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#122c39;color:white;padding:24px 6vw 88px}nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff33;padding-bottom:20px}.brand{font-size:24px;font-weight:800;letter-spacing:.1em}.logo{color:#e0c37a}small{font-size:13px}header h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(38px,7vw,76px);margin:40px 0 10px;letter-spacing:-.05em}header p{color:#c5d6dc;margin:0;line-height:1.7}.wrap{max-width:1160px;margin:-55px auto 0;padding:0 20px 64px}.toolbar{background:white;border:1px solid #d9e0de;padding:18px 24px;border-radius:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 30px #122c3914}input,select,button{font:inherit;border-radius:6px;padding:10px 12px;border:1px solid #ccd5d4;background:white;color:#152e3c}input[type=search]{flex:1;min-width:150px}button{cursor:pointer}button.active{background:#122c39;color:white;border-color:#122c39}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 18px}.section{display:flex;justify-content:space-between;align-items:center}.section h2{font-size:22px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:white;border:1px solid #dbe2df;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px;min-width:0}.card:first-child{grid-column:1/-1;border-left:5px solid #b48b3c;padding:32px}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:#526873}.tag{background:#e8efed;color:#285247;padding:5px 10px;border-radius:20px;font-weight:700}.card h3{margin:0;font-size:24px;line-height:1.4}.card:first-child h3{font-size:clamp(26px,4vw,38px)}.original{font-size:14px;color:#657781}.card p{margin:0;line-height:1.85}.why{background:#f2f5f2;padding:12px;border-radius:6px;color:#345649;font-size:15px}.card a{color:#1d6955;font-weight:700;text-decoration:none;margin-top:auto}.foot{color:#5e7077;line-height:1.8;margin:30px 0;font-size:14px}.empty{padding:50px;text-align:center;background:white;border-radius:10px;grid-column:1/-1}.status{color:#d9bd78;font-weight:700}@media(max-width:650px){header{padding:20px 20px 84px}nav small{display:none}.cards{grid-template-columns:1fr}.card,.card:first-child{padding:22px}.toolbar{padding:16px}.toolbar label{width:100%}.section{align-items:flex-start;gap:10px}.section h2{margin:8px 0}.filters{margin-top:20px}}</style><style>.read-btn{align-self:flex-start;background:#122c39;color:white;font-weight:700;border:0;padding:12px 16px}.read-btn:hover{background:#24556a}.card h3{cursor:pointer}.reader{border:none;border-radius:14px;width:min(760px,calc(100% - 24px));max-height:90vh;padding:0;color:#152e3c;background:white;box-shadow:0 12px 60px #0004}.reader::backdrop{background:#122c39b8}.reader-inner{padding:clamp(22px,5vw,46px)}.reader-top{display:flex;justify-content:space-between;align-items:center;gap:18px}.reader h2{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(27px,4vw,40px);line-height:1.45;margin:22px 0 10px}.reader h3{border-top:1px solid #dbe2df;margin-top:28px;padding-top:20px}.reader p{line-height:1.95;margin:12px 0}.reader a{color:#1d6955;font-weight:700}.reader .notice{font-size:14px;color:#526873;background:#f2f5f2;padding:12px;border-radius:6px}.reader .close{position:sticky;top:8px;background:white;flex-shrink:0}</style><style>.article-image{margin:24px 0 30px;background:#f3f5f4;border:1px solid #dbe2df;border-radius:10px;overflow:hidden}.article-image img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#eef2ef}.article-image figcaption{padding:12px 16px;display:flex;gap:6px 14px;flex-wrap:wrap;line-height:1.5;color:#526873;font-size:13px}.article-image figcaption span:first-child{width:100%;font-size:14px;color:#152e3c}.article-section{margin:20px 0}.article-section h3{font-size:22px;border-top:2px solid #b8c9c6;padding-top:20px}.article-section .section-hint{font-size:14px;color:#526873}.brief-section{background:#f0f5f2;padding:20px 24px;border-radius:8px}.brief-section h3{border:0;padding-top:0;margin:0 0 15px}.brief-section ul{padding-left:22px;line-height:1.9;margin:12px 0}.brief-section li{margin:6px 0}.brief-section h4{font-size:16px;margin-bottom:0;color:#285247}@media(max-width:650px){.article-image img{max-height:280px}.brief-section{padding:16px}.article-section h3{font-size:20px}}</style></head><body><header><nav><div class="brand"><span class="logo">●</span> 世界日報</div><small>WORLD BRIEF / 每日精選</small></nav><h1>讀懂今天的世界。</h1><p>全球重大事件 · 中英新聞來源 · 繁體中文摘要<br>略過天災，聚焦每天真正值得了解的變化。</p></header><main class="wrap"><div class="toolbar"><label>新聞日期 <select id="day" aria-label="新聞日期"></select></label><input id="search" type="search" placeholder="搜尋新聞、關鍵字或來源" aria-label="搜尋新聞"><button id="refresh">重新整理</button></div><div class="filters" id="filters"></div><div class="section"><h2 id="heading">今日重點</h2><small id="count"></small></div><div id="cards" class="cards" aria-live="polite"></div><p id="status" class="foot"></p><div class="foot">編輯原則：優先可信中英文媒體、官方消息與交叉核對；不收錄自然災害。英文原文標題及繁中摘要並列，詳細報導請點擊來源。摘要是編輯整理，不是完整原文翻譯。</div></main><script>
let data,cat='全部';const $=id=>document.getElementById(id);const categories=['全部','國際','台灣','財經','科技','政治','社會','其他'];function el(tag,txt,cls){const n=document.createElement(tag);if(txt)n.textContent=txt;if(cls)n.className=cls;return n}function render(){if(!data)return;const q=$('search').value.toLowerCase();const list=data.stories.filter(s=>(cat==='全部'||s.category===cat)&&JSON.stringify(s).toLowerCase().includes(q));$('heading').textContent=data.date+' 新聞精選';$('count').textContent=list.length+' 則新聞';$('cards').replaceChildren();if(!list.length)$('cards').append(el('div','目前沒有符合的新聞。','empty'));for(const s of list){const x=el('article','','card'),meta=el('div','','meta');meta.append(el('span',s.category,'tag'),el('span',s.source),el('span',s.lang==='EN'?'英文來源・已翻譯':'中文來源'));x.append(meta,el('h3',s.title));if(s.original)x.append(el('div',s.original,'original'));x.append(el('p',s.summary),el('p','值得關注：'+s.impact,'why'));try{const u=new URL(s.url);if(u.protocol==='https:'||u.protocol==='http:'){const a=el('a','閱讀來源報導');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';x.append(a)}}catch{}$('cards').append(x)}$('status').textContent='本期更新：'+data.updated+'（台灣時間）'}function tabs(){for(const c of categories){const b=el('button',c,c==='全部'?'active':'');b.onclick=()=>{cat=c;for(const n of $('filters').children)n.classList.toggle('active',n===b);render()};$('filters').append(b)}}async function load(date){$('status').textContent='正在載入新聞…';try{const r=await fetch('./news.json',{cache:'no-store'});if(!r.ok)throw Error();const archive=await r.json();const dates=Object.keys(archive.editions).sort().reverse();const selected=date&&archive.editions[date]?date:dates[0];data={...archive.editions[selected],dates};$('day').replaceChildren(...data.dates.map(d=>{const n=el('option',d);n.value=d;n.selected=d===data.date;return n}));render()}catch{$('status').textContent='暫時無法讀取新聞，請稍後重新整理。'}}$('search').oninput=render;$('day').onchange=()=>load($('day').value);$('refresh').onclick=()=>load($('day').value);tabs();load();</script><dialog id="reader" class="reader"><div class="reader-inner"><div class="reader-top"><span class="tag">站內閱讀</span><button class="close" id="readerClose">關閉 ×</button></div><div id="readerBody"></div></div></dialog><script>
function safeLink(url,label){try{const u=new URL(url);if(u.protocol!=='https:')return null;const a=el('a',label);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a}catch{return null}}
function showArticle(s){
const body=$('readerBody');body.replaceChildren();
body.append(el('h2',s.title),el('div',s.source+' · '+(s.published||data.date)+' · '+(s.lang==='EN'?'英文來源・繁中編譯':'中文來源'),'meta'));
if(s.original)body.append(el('p',s.original,'original'));
const originalLink=safeLink(s.url,'閱讀原文及原始照片');
if(originalLink)body.append(originalLink);
if(s.image&&s.image.url){try{const url=new URL(s.image.url);if(url.protocol==='https:'){const figure=el('figure','','article-image');const image=el('img');image.src=url.href;image.alt=s.image.caption||s.title;image.loading='lazy';image.referrerPolicy='no-referrer';image.onerror=()=>{image.remove()};const caption=el('figcaption');caption.append(el('span',(s.image.kind==='original'?'原文授權圖片｜':'相關資料圖片｜')+(s.image.caption||'新聞相關圖片')),el('span','圖源：'+(s.image.credit||'來源網站')+' · '+(s.image.license||'授權資訊見來源')));const src=safeLink(s.image.source,'圖片來源');const license=safeLink(s.image.licenseUrl,'授權資訊');if(src)caption.append(src);if(license)caption.append(license);figure.append(image,caption);body.append(figure)}}catch{}}
else if(originalLink){const note=el('p','原始報導圖片可透過上方連結瀏覽。','notice');body.append(note)}
const article=el('section','','article-section');article.append(el('h3','第一部分｜'+(s.translationType==='authorized-full'?'授權全文翻譯':'繁體中文報導正文')),el('p',s.translationType==='authorized-full'?'已取得全文翻譯使用授權。':'依來源報導，以繁體中文編譯呈現；非逐字或完整原文翻譯。','section-hint'));
const paragraphs=Array.isArray(s.article)&&s.article.length?s.article:[s.summary,...(s.detail||[]),s.background].filter(Boolean);
for(const p of paragraphs)article.append(el('p',p));body.append(article);
const brief=el('section','','article-section brief-section');brief.append(el('h3','第二部分｜重點整理'));const points=Array.isArray(s.keyPoints)&&s.keyPoints.length?s.keyPoints:[s.summary];const list=el('ul');for(const p of points)if(p)list.append(el('li',p));brief.append(list);if(s.impact)brief.append(el('h4','為什麼重要'),el('p',s.impact));if(s.watch)brief.append(el('h4','後續觀察'),el('p',s.watch));body.append(brief);
body.append(el('p','圖片均標示來源與授權；原文內容及未獲授權的原始圖片請至原報導閱讀。','notice'));const endLink=safeLink(s.url,'前往原始報導');if(endLink)body.append(endLink);
$('reader').showModal();$('reader').scrollTop=0;$('readerClose').focus()}
function addReadButtons(){for(const card of $('cards').querySelectorAll('.card')){if(card.querySelector('.read-btn'))continue;const title=card.querySelector('h3');const s=data?.stories.find(x=>x.title===title?.textContent);if(!s)continue;const btn=el('button','站內閱讀完整整理','read-btn');btn.onclick=()=>showArticle(s);title.onclick=()=>showArticle(s);card.insertBefore(btn,card.querySelector('a'))}}new MutationObserver(addReadButtons).observe($('cards'),{childList:true});addReadButtons();$('readerClose').onclick=()=>$('reader').close();$('reader').addEventListener('click',e=>{if(e.target===$('reader'))$('reader').close()});</script></body></html>
